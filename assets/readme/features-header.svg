<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="150" viewBox="0 0 1200 150"
     role="img" aria-labelledby="features-title features-desc">
  <title id="features-title">TabCraft features</title>
  <desc id="features-desc">Section header for the feature table: AI grouping, hibernation,
    duplicate detection, workspaces, and 100 percent private local processing.</desc>

  <rect width="1200" height="150" fill="#0F1117"/>

  <text x="64" y="58" font-size="40" font-weight="700" fill="#E8EAED"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">Features</text>

  <text x="64" y="92" font-size="22" fill="#9AA0A6"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">Everything runs locally in your Chrome side panel</text>

  <g id="feature-anchors" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="18" font-weight="600">
    <rect x="64" y="104" width="175" height="34" rx="17" fill="#4285F4" opacity="0.14"/>
    <circle cx="84" cy="121" r="5" fill="#4285F4"/>
    <text x="102" y="127" fill="#4285F4">AI GROUPING</text>

    <rect x="253" y="104" width="175" height="34" rx="17" fill="#4285F4" opacity="0.14"/>
    <circle cx="273" cy="121" r="5" fill="#4285F4"/>
    <text x="291" y="127" fill="#4285F4">HIBERNATION</text>

    <rect x="442" y="104" width="164" height="34" rx="17" fill="#4285F4" opacity="0.14"/>
    <circle cx="462" cy="121" r="5" fill="#4285F4"/>
    <text x="480" y="127" fill="#4285F4">DUPLICATES</text>

    <rect x="620" y="104" width="164" height="34" rx="17" fill="#4285F4" opacity="0.14"/>
    <circle cx="640" cy="121" r="5" fill="#4285F4"/>
    <text x="658" y="127" fill="#4285F4">WORKSPACES</text>

    <rect x="798" y="104" width="132" height="34" rx="17" fill="#34A853" opacity="0.14"/>
    <circle cx="818" cy="121" r="5" fill="#34A853"/>
    <text x="836" y="127" fill="#34A853">PRIVATE</text>
  </g>
</svg>
