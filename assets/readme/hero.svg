<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">TabCraft — AI tab manager for Chrome, running on device</title>
  <desc id="desc">TabCraft title block next to a Chrome tab strip: five ungrouped tabs
    with two duplicates open collapse into three topic groups (Development, Investment,
    Entertainment), with the duplicates merged and an inactive tab hibernated. All
    classification happens on device, so no page data leaves the browser.</desc>

  <defs>
    <clipPath id="hero-clip">
      <rect width="1200" height="420" rx="16"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="420" fill="#0F1117"/>
  </g>

  <!-- Left: identity block -->
  <g id="title-block" transform="translate(64 0)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="0" y="52" width="320" height="36" rx="18" fill="#4285F4" opacity="0.14"/>
    <text x="160" y="77" text-anchor="middle" font-size="20" font-weight="600"
          letter-spacing="1" fill="#4285F4"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CHROME EXTENSION · MV3</text>

    <text x="0" y="150" font-size="68" font-weight="700" letter-spacing="-1"
          fill="#E8EAED">TabCraft</text>

    <text x="0" y="204" font-size="25" font-weight="500" fill="#E8EAED">Groups tabs by topic, not by domain.</text>
    <text x="0" y="238" font-size="25" fill="#9AA0A6">On-device AI. Nothing leaves the browser.</text>

    <g id="capabilities" transform="translate(0 272)" font-size="22" fill="#9AA0A6">
      <circle cx="5" cy="3" r="4" fill="#4285F4"/>
      <text x="24" y="10">Topic grouping with a rule-based fallback</text>
      <circle cx="5" cy="43" r="4" fill="#4285F4"/>
      <text x="24" y="50">Inactive tabs hibernated to free memory</text>
      <circle cx="5" cy="83" r="4" fill="#4285F4"/>
      <text x="24" y="90">Duplicate tabs merged, tracking params ignored</text>
    </g>

    <text x="0" y="396" font-size="18" fill="#9AA0A6"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v0.1.9 · TypeScript · MIT · 390 built-in rules</text>
  </g>

  <!-- Right: Chrome window with the tab strip before and after grouping -->
  <g id="project-proof" transform="translate(616 20)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="0" y="0" width="520" height="384" rx="16" fill="#14161D" stroke="#2A2D37" stroke-width="1"/>

    <!-- Window toolbar -->
    <circle cx="20" cy="24" r="5" fill="#3A3F4B"/>
    <circle cx="40" cy="24" r="5" fill="#3A3F4B"/>
    <circle cx="60" cy="24" r="5" fill="#3A3F4B"/>
    <rect x="84" y="10" width="412" height="30" rx="15" fill="#1E2028"/>
    <text x="104" y="30" font-size="18" fill="#9AA0A6"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">chrome://extensions · TabCraft MV3</text>

    <!-- Before: one ungrouped strip with a duplicate pair -->
    <text x="28" y="70" font-size="20" font-weight="600" letter-spacing="2" fill="#9AA0A6"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BEFORE</text>
    <text x="492" y="70" text-anchor="end" font-size="20" font-weight="600" fill="#EA4335">duplicate</text>

    <g id="before-strip">
      <rect x="28" y="84" width="88" height="28" rx="6" fill="#1E2028" stroke="#2A2D37"/>
      <circle cx="44" cy="98" r="5" fill="#9AA0A6"/>
      <rect x="56" y="95" width="44" height="6" rx="3" fill="#3A3F4B"/>

      <rect x="122" y="84" width="88" height="28" rx="6" fill="#1E2028" stroke="#EA4335" stroke-width="1.5"/>
      <circle cx="138" cy="98" r="5" fill="#9AA0A6"/>
      <rect x="150" y="95" width="44" height="6" rx="3" fill="#3A3F4B"/>

      <rect x="216" y="84" width="88" height="28" rx="6" fill="#1E2028" stroke="#EA4335" stroke-width="1.5"/>
      <circle cx="232" cy="98" r="5" fill="#9AA0A6"/>
      <rect x="244" y="95" width="44" height="6" rx="3" fill="#3A3F4B"/>

      <rect x="310" y="84" width="88" height="28" rx="6" fill="#1E2028" stroke="#2A2D37"/>
      <circle cx="326" cy="98" r="5" fill="#9AA0A6"/>
      <rect x="338" y="95" width="30" height="6" rx="3" fill="#3A3F4B"/>

      <rect x="404" y="84" width="88" height="28" rx="6" fill="#1E2028" stroke="#2A2D37"/>
      <circle cx="420" cy="98" r="5" fill="#9AA0A6"/>
      <rect x="432" y="95" width="52" height="6" rx="3" fill="#3A3F4B"/>
    </g>
    <text x="28" y="142" font-size="20" fill="#9AA0A6">Ungrouped tabs, duplicates open</text>

    <!-- Classification step -->
    <text x="260" y="176" text-anchor="middle" font-size="20" font-weight="600" fill="#4285F4">on-device AI</text>
    <path d="M260 184 L260 200" stroke="#4285F4" stroke-width="2" fill="none"/>
    <path d="M252 198 L260 210 L268 198 Z" fill="#4285F4"/>

    <!-- After: topic groups with a merge and a hibernation state -->
    <text x="28" y="228" font-size="20" font-weight="600" letter-spacing="2" fill="#34A853"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AFTER</text>

    <g id="after-groups">
      <rect x="28" y="238" width="464" height="42" rx="8" fill="#1E2028" stroke="#2A2D37"/>
      <rect x="30" y="247" width="3" height="24" rx="1.5" fill="#4285F4"/>
      <text x="46" y="255" font-size="20" font-weight="600" fill="#E8EAED">DEVELOPMENT</text>
      <text x="46" y="274" font-size="18" fill="#9AA0A6">github.com/alloevil/TabCraft</text>
      <rect x="358" y="247" width="120" height="24" rx="12" fill="#34A853" opacity="0.14"/>
      <text x="418" y="264" text-anchor="middle" font-size="18" fill="#34A853">dup merged</text>

      <rect x="28" y="286" width="464" height="42" rx="8" fill="#1E2028" stroke="#2A2D37"/>
      <rect x="30" y="295" width="3" height="24" rx="1.5" fill="#4285F4"/>
      <text x="46" y="303" font-size="20" font-weight="600" fill="#E8EAED">INVESTMENT</text>
      <text x="46" y="322" font-size="18" fill="#9AA0A6">localhost — Investment Dashboard</text>

      <rect x="28" y="334" width="464" height="42" rx="8" fill="#1E2028" stroke="#2A2D37"/>
      <rect x="30" y="343" width="3" height="24" rx="1.5" fill="#4285F4"/>
      <text x="46" y="351" font-size="20" font-weight="600" fill="#E8EAED">ENTERTAINMENT</text>
      <text x="46" y="370" font-size="18" fill="#9AA0A6">youtube.com — TypeScript</text>
      <rect x="358" y="343" width="120" height="24" rx="12" fill="#4285F4" opacity="0.14"/>
      <text x="418" y="360" text-anchor="middle" font-size="18" fill="#4285F4">hibernated</text>
    </g>
  </g>
</svg>
