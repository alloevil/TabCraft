name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the repository and reports status. Nothing here needs
# write access, so the default token is narrowed instead of inherited.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first — a break on one Node
      # release and a break on both are different bugs.
      fail-fast: false
      matrix:
        # The two Node lines still under support: 22 (EOL 2027-04-30) and 24
        # (EOL 2028-04-30). Node 20 went end-of-life on 2026-04-30, and the test
        # environment no longer runs there at all — jsdom 30 declares
        # `^22.22.2 || ^24.15.0 || >=26`. Two versions rather than one because
        # the extension leans on runtime APIs that shift between releases
        # (Intl.Segmenter, AbortSignal.timeout).
        node-version: [22, 24]

    steps:
      # Actions are pinned to commit SHAs, not the mutable v4 tag: a tag can be
      # repointed at new code without the workflow changing. Dependabot's
      # github-actions ecosystem proposes the bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm's own version is part of the toolchain, not an implementation
      # detail. This project pins transitive versions through `overrides`, and
      # npm 10 and 11 materialise an overridden tree differently — a lockfile
      # one considers in sync, the other rejects with "Missing: … from lock
      # file". Node 20 and 22 both ship npm 10, so without this step the npm
      # that verifies the lockfile is never the npm that wrote it.
      - name: Pin npm to packageManager
        run: |
          want="$(node -p "require('./package.json').packageManager.replace('npm@','')")"
          [ "$(npm --version)" = "$want" ] || npm i -g "npm@$want"
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Coverage rather than a plain run: vitest.config.ts carries thresholds,
      # and a threshold nothing enforces is a comment.
      - run: npm run test:coverage
      - run: npm run build
      # `plasmo build` exiting 0 does not mean the extension can run: Parcel
      # will happily emit bundles with every dependency left unresolved. This
      # asserts they were actually inlined.
      - run: npm run verify:build

      # Lets a reviewer load the extension straight from the PR instead of
      # building it themselves. One upload is enough — the build output does not
      # depend on the Node version used to produce it.
      - name: Upload unpacked extension
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod
          if-no-files-found: error
          retention-days: 14
