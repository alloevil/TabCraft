name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the repository and reports status. Nothing here needs
# write access, so the default token is narrowed instead of inherited.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first — a break on one Node
      # release and a break on both are different bugs.
      fail-fast: false
      matrix:
        # 20 is the floor documented in CONTRIBUTING; 22 is what contributors
        # are likely running locally. Runtime APIs the extension relies on
        # (Intl.Segmenter, AbortSignal.timeout) are version-sensitive, so one
        # pinned version proves less than it appears to.
        node-version: [20, 22]

    steps:
      # Actions are pinned to commit SHAs, not the mutable v4 tag: a tag can be
      # repointed at new code without the workflow changing. Dependabot's
      # github-actions ecosystem proposes the bumps.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Coverage rather than a plain run: vitest.config.ts carries thresholds,
      # and a threshold nothing enforces is a comment.
      - run: npm run test:coverage
      - run: npm run build

      # Lets a reviewer load the extension straight from the PR instead of
      # building it themselves. One upload is enough — the build output does not
      # depend on the Node version used to produce it.
      - name: Upload unpacked extension
        if: matrix.node-version == 20
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod
          if-no-files-found: error
          retention-days: 14
