# Dependabot keeps two ecosystems current: the npm tree and the actions used by
# the workflows in .github/workflows. Security updates are already enabled at the
# repository level; this file adds the scheduled *version* updates, which is what
# was missing — the 28 alerts closed in 8e27b8b had to be batched by hand.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group order matters: a dependency lands in the first group it matches.
    groups:
      # react, react-dom and their @types must move as one unit — the types
      # major has to match the runtime major. Splitting them (as happened in
      # #20, where @types/react went to 19 while @types/react-dom stayed on 18)
      # produces a graph npm refuses to resolve: ERESOLVE, before any test runs.
      # No update-types filter here, so majors stay grouped too.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # vitest and its coverage provider are released in lockstep and refuse to
      # run against a mismatched major, so a split (#29 and #30) leaves both PRs
      # red no matter what CI does.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # One PR for the whole minor/patch sweep; other majors stay individual so
      # a breaking bump is never buried in a batch.
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      # The repo uses unscoped conventional subjects — no "(deps)" scope.
      prefix: chore

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-all:
        patterns: ['*']
    commit-message:
      prefix: chore
